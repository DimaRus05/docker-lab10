upstream loadbalancer {
    # Все процессы nginx используют общие счётчики.
    zone backends 64k;
    # Запросы идут по очереди к app1 и app2.
    server app1:8080;
    server app2:8080;
}

server {
    listen 443 ssl;
    server_name localhost;
    # Сертификат и ключ созданы внутри образа.
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Запрос значка сайта не должен менять очередь приложений.
    location = /favicon.ico {
        return 204;
    }

    location / {
        # До nginx идёт HTTPS, дальше к приложениям идёт HTTP.
        proxy_pass http://loadbalancer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
}
